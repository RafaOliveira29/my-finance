services:
  db:
    image: postgres:16-alpine
    container_name: myfinance-db
    environment:
      POSTGRES_USER: myfinance
      POSTGRES_PASSWORD: myfinance_dev
      POSTGRES_DB: myfinance
    ports:
      - "5433:5432"
    volumes:
      - myfinance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myfinance -d myfinance"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  myfinance_pgdata:
